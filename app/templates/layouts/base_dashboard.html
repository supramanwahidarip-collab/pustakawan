<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    {% extends "layouts/base.html" %}

{% block body %}
<div x-data="{ sidebarOpen: false }" class="flex h-screen bg-slate-50">

    <!-- Sidebar Desktop & Mobile -->
    <div :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="fixed inset-y-0 left-0 z-50 w-64 transform bg-tosca-900 text-white transition-transform duration-300 ease-in-out lg:static lg:translate-x-0">
        <div class="flex h-16 items-center justify-between px-6 bg-tosca-950">
            <span class="text-xl font-bold tracking-tight">Tosca<span class="text-tosca-400">Lib</span></span>
            <button @click="sidebarOpen = false" class="lg:hidden text-tosca-300 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="mt-6 space-y-1 px-3">
            <p class="px-3 text-xs font-semibold uppercase tracking-wider text-tosca-400 mb-2">Menu Utama</p>

            <!-- Menu 1: Dashboard Utama -->
            <a href="{{ url_for('librarian.dashboard') }}" class="flex items-center rounded-xl px-3 py-2.5 text-sm font-medium text-tosca-100 hover:bg-tosca-800">
                <svg class="mr-3 h-5 w-5 text-tosca-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Dashboard Utama
            </a>

            <!-- Menu 2: Sirkulasi Peminjaman -->
            <a href="{{ url_for('librarian.manage_loans') }}" class="flex items-center rounded-xl px-3 py-2.5 text-sm font-medium text-tosca-100 hover:bg-tosca-800">
                <svg class="mr-3 h-5 w-5 text-tosca-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                Sirkulasi Peminjaman
            </a>
        </nav>
    </div>

    <!-- Area Konten Utama -->
    <div class="flex flex-1 flex-col overflow-hidden">
        <!-- Topbar -->
        <header class="flex h-16 items-center justify-between bg-white px-6 shadow-sm ring-1 ring-slate-200 lg:justify-end">
            <button @click="sidebarOpen = true" class="lg:hidden text-slate-500 hover:text-slate-700">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <div class="flex items-center gap-4">
                <span class="text-sm font-medium text-slate-700">{{ current_user.full_name }} (Pustakawan)</span>
                <form action="{{ url_for('auth.logout') }}" method="POST" class="inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="rounded-lg bg-rose-50 px-3 py-1.5 text-xs font-semibold text-rose-600 hover:bg-rose-100 transition">Logout</button>
                </form>
            </div>
        </header>

        <!-- Konten Halaman -->
        <main class="flex-1 overflow-y-auto bg-slate-50 p-6">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
</body>
</html>
